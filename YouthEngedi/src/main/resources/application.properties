# APPLICATION SETUP
spring.config.import=optional:file:.env[.properties]
spring.application.name=${APP_NAME:youth-engedi}
app.production=false
onnx.model.path=classpath:models/open-nsfw.onnx

# Java 21+ Virtual Threads
spring.threads.virtual.enabled=true

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DATABASE & CONNECTION POOL (HikariCP)
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${JDBC_USERNAME}
spring.datasource.password=${JDBC_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP: Fast-fail timeouts to prevent container startup stalls
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5


# SPRING BOOT ACTUATOR & CLOUD PROBES

# Exposure
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.exposure.exclude=env,beans

# Enable dedicated /actuator/health/liveness and /readiness for Render
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Prevent remote network hangs from failing app health checks
management.health.mail.enabled=false
management.health.redis.enabled=false


# LOGGING
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# AUTHENTICATION & SECURITY (JWT & OAuth2)

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=3600000

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Facebook OAuth2
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Azure OAuth2

# Registration (CLIENT ID: 7c14435f-0099-4495-9632-9812e3744fc6)
spring.security.oauth2.client.registration.azure.client-id=${AZURE_CLIENT_ID:141c3e46-538e-4839-9918-c2d50d8b180e}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_CLIENT_SECRET}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.redirect-uri={BASEURL}/login/oauth2/code/azure
spring.security.oauth2.client.registration.azure.client-name=Microsoft Entra ID
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.provider=azure

# Provider Endpoints (common)
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-name-attribute=preferred_username

# EMAIL (SMTP & Resend API)

# Resend
resend.api.key=${RESEND_API_KEY}

# Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.youth.email=${MAIL_YOUTH_EMAIL}

# SMTP Auth & Encryption
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Critical Network Timeouts (Prevents thread starvation)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



# CACHING (Redis)

spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=5000
app.redis.expiration-minutes=60



# THIRD-PARTY INTEGRATIONS & APIS

# Cloudinary
CLOUDINARY_URL=${CLOUDINARY_URL}

# Internal APIs
internal.api=${INTERNAL_API}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/my-docs
springdoc.api-docs.path=/api-definitions
springdoc.swagger-ui.filter=true



# RESILIENCE4J (Circuit Breaker)

resilience4j.circuitbreaker.instances.pythonService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.pythonService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.pythonService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.pythonService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.pythonService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.pythonService.permittedNumberOfCallsInHalfOpenState=3